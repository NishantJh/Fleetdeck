services:
  homelab-manager:
    build: .
    container_name: homelab-manager
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # config.yaml, SSH key, known_hosts, Incus client cert
      - ./config:/config:ro
    environment:
      HOMELAB_PASSWORD: ${HOMELAB_PASSWORD}
      PVE_TOKEN_SECRET: ${PVE_TOKEN_SECRET}
