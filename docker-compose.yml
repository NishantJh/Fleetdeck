# The whole install: `docker compose up -d` (or paste this into an Arcane project and deploy), then
# open the setup link from the logs (`docker compose logs homelab-manager`, or the container's logs
# in Arcane). Nothing else to create, copy or chown.
services:
  homelab-manager:
    # Pin a release (e.g. :0.2.0) rather than :latest so an update is something you choose.
    image: ghcr.io/nishantjh/homelab-manager:latest
    # To build from source instead of pulling the image:
    # build: .
    container_name: homelab-manager
    restart: unless-stopped
    ports:
      # To listen on one interface only, prefix its IP: "192.168.1.50:8080:8080"
      - "8080:8080"
    volumes:
      # Config, the dashboard's own keys and its history. Back this folder up; it is the whole install.
      - ./data:/data
    # Hardening: read-only filesystem, and only the capabilities needed to hand ./data to the app's
    # user (uid 10001) at start. The app drops them, and root, before it does anything else.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
