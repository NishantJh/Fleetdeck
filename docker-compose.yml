# The whole install: `docker compose up -d`, or paste this into any compose manager (Portainer,
# Dockge, Arcane, Komodo, ...) and deploy. Then open http://<this machine>:8080 and enter the
# setup code from the container's logs.
# Nothing else to create, copy or chown.
services:
  fleetdeck:
    # Pin a release rather than :latest so an update is something you choose:
    # :1.2.3 = exactly that release, :1.2 = patch fixes only, :1 = any 1.x update.
    image: ghcr.io/nishantjh/fleetdeck:latest
    # To build from source instead of pulling the image:
    # build: .
    container_name: fleetdeck
    restart: unless-stopped
    ports:
      # Port 8080 taken on this host? Set FLEETDECK_PORT (e.g. 8081) in the environment or .env
      # instead of editing this. To listen on one interface only: "192.168.1.50:${FLEETDECK_PORT:-8080}:8080"
      - "${FLEETDECK_PORT:-8080}:8080"
    environment:
      # Only so the setup link in the logs shows the right port.
      FLEETDECK_PORT: ${FLEETDECK_PORT:-8080}
    volumes:
      # Config, the dashboard's own keys and its history: the whole install, so back it up.
      # A named volume works the same in every tool. To keep it in a folder instead, use e.g.
      # `- ./data:/data`. The app runs as the folder's owner, so it stays yours (a root-owned one
      # goes to uid 10001). Rootless Docker/Podman: add `environment: {PUID: "0"}`.
      - fleetdeck-data:/data
      # Optional: one folder for every machine's config backup ("Back up" > "On the dashboard"). Without
      # this they go to host-backups/ in the data volume. Uncomment, put your folder on the left, and
      # set FLEETDECK_BACKUP_FOLDER: /backups above.
      # - /apps/backups:/backups
    # Hardening: read-only filesystem, and only the capabilities needed to sort out /data's owner at
    # start. The app drops them, and root, before it does anything else.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true

volumes:
  fleetdeck-data:
