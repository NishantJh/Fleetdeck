# Isolated demo only: fake machines, no access to the live Fleetdeck data or Docker socket.
# Run: docker compose -f docker-compose.preview.yml up -d --build
name: fleetdeck-preview
services:
  fleetdeck-preview:
    build: .
    image: fleetdeck-local:dashboard-preview
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      FLEETDECK_DEMO: "1"
      FLEETDECK_PORT: "8081"
    volumes:
      - preview-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
volumes:
  preview-data:
