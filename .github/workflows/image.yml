name: Image
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
jobs:
  image:
    # The runner is the owner's own machine: never run code from a fork's pull request on it.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, vm]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # Helper images come from mirror.gcr.io too: Docker Hub rate-limits CI pulls (429).
      - uses: docker/setup-qemu-action@v4
        with:
          image: mirror.gcr.io/tonistiigi/binfmt:latest
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/fleetdeck
            ghcr.io/${{ github.repository_owner }}/homelab-manager
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            # A tag like v1.2.3 publishes :1.2.3, :1.2 and :1 (:1 is skipped for 0.x releases).
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # Pull requests only check that the image builds.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
