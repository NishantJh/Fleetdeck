name: Clean up old images
on:
  workflow_run:
    workflows: [Image]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Only list what would be deleted
        type: boolean
        default: true
concurrency:
  group: ghcr-cleanup
jobs:
  cleanup:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, vm]
    strategy:
      matrix:
        # homelab-manager is the old image name, still published as an alias.
        package: [fleetdeck, homelab-manager]
    permissions:
      packages: write
    steps:
      # Every build gets its own sha-<commit> tag, so those pile up and nothing is ever untagged.
      # Keep the newest 10 sha- tags and delete the rest (latest and v* release tags never match
      # sha-*). Then delete untagged versions no tagged image uses. A multi-arch image is a tagged
      # index plus untagged amd64/arm64 manifests; the action keeps those while the index exists,
      # so remaining tags still pull, and validate: true checks that after the run.
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: ${{ matrix.package }}
          delete-tags: sha-*
          keep-n-tagged: 10
          exclude-tags: latest
          keep-n-untagged: 3
          validate: true
          # Dry run until the repository variable GHCR_CLEANUP_LIVE is 'true': run it manually first,
          # read the log, then set the variable (Settings > Secrets and variables > Actions > Variables).
          dry-run: ${{ vars.GHCR_CLEANUP_LIVE != 'true' || (github.event_name == 'workflow_dispatch' && inputs.dry-run) }}
