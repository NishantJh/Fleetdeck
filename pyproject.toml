[project]
name = "fleetdeck"
version = "2.0.0"
description = "One dashboard to manage a homelab: OS updates across Proxmox, Incus and plain hosts."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.31",  # 0.31 added CIDR ranges in forwarded_allow_ips
  "httpx>=0.27",
  "asyncssh>=2.14",
  "cryptography>=42",
  "pydantic>=2.6",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fleetdeck*"]

[tool.setuptools.package-data]
fleetdeck = ["static/*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
